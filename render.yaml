services:
  - type: web
    name: weko-traffic
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/yeseu78/KOICAsite
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://obtnbductdphderzkftf.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_ANALYTICS_TABLE
        value: weko_analytics_events
      - key: KPI_SURVEY_TARGET
        value: 1500
      - key: KPI_SHARE_TARGET
        value: 500
      - key: KPI_COMPLETION_RATE_TARGET
        value: 85
      - key: KPI_INSTAGRAM_TARGET
        value: 1000
